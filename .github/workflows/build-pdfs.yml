name: Build resume PDFs

on:
  push:
    branches: [main]
    paths: ["src/**", "scripts/**", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to refresh the rolling "latest" release

concurrency:
  group: build-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live (XeLaTeX) and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended fonts-lmodern latexmk poppler-utils

      - name: Compile resumes and run ATS checks
        run: scripts/build.sh

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: dist/*.pdf
          if-no-files-found: warn

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log

      - name: Refresh rolling "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.pdf \
            --title "Latest resumes" \
            --notes "Built from commit ${GITHUB_SHA::7}" \
            --latest
